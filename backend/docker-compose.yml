services:
  db:
    image: timescale/timescaledb:2-pg16
    environment:
      POSTGRES_USER: autosense
      POSTGRES_PASSWORD: autosense
      POSTGRES_DB: autosense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://autosense:autosense@db:5432/autosense
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-to-a-long-random-string
    depends_on:
      - db
      - redis

volumes:
  pgdata:
